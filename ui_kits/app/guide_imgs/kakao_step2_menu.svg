<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <!-- Background -->
  <rect width="300" height="180" fill="#1a1a1a"/>

  <!-- Chat header -->
  <rect x="0" y="0" width="300" height="52" fill="#1a1a1a"/>
  <!-- Back arrow -->
  <path d="M14 26 L24 18 M14 26 L24 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Friend avatar -->
  <circle cx="46" cy="26" r="16" fill="#FEE500"/>
  <text x="46" y="30" fill="#3C1E1E" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" text-anchor="middle">민지</text>
  <!-- Friend name -->
  <text x="72" y="22" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">김민지</text>
  <text x="72" y="36" fill="#888" font-family="-apple-system,sans-serif" font-size="11">카카오톡</text>

  <!-- Hamburger menu - HIGHLIGHTED -->
  <rect x="256" y="12" width="36" height="28" rx="6" fill="#FEE500" opacity="0.15"/>
  <rect x="256" y="12" width="36" height="28" rx="6" fill="none" stroke="#FEE500" stroke-width="2"/>
  <line x1="262" y1="22" x2="286" y2="22" stroke="#FEE500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="262" y1="28" x2="286" y2="28" stroke="#FEE500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="262" y1="34" x2="286" y2="34" stroke="#FEE500" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="0" y1="52" x2="300" y2="52" stroke="#333" stroke-width="0.5"/>

  <!-- Chat bubbles (faded) -->
  <rect x="16" y="68" width="140" height="28" rx="14" fill="#2a2a2a"/>
  <text x="32" y="87" fill="#888" font-family="-apple-system,sans-serif" font-size="13">안녕! 뭐 해? 😊</text>

  <rect x="144" y="106" width="140" height="28" rx="14" fill="#FEE500"/>
  <text x="160" y="125" fill="#3C1E1E" font-family="-apple-system,sans-serif" font-size="13">나 지금 집이야 왜</text>

  <!-- Arrow pointing to hamburger -->
  <line x1="260" y1="10" x2="250" y2="4" stroke="#FEE500" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="54" y="150" width="192" height="20" rx="10" fill="#FEE500"/>
  <text x="150" y="164" fill="#3C1E1E" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">오른쪽 위 ☰ 탭하기</text>
</svg>
