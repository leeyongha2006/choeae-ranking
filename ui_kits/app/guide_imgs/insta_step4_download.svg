<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <!-- Background -->
  <rect width="300" height="280" fill="#000"/>

  <!-- Top bar -->
  <path d="M16 22 L26 14 M16 22 L26 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="28" fill="#fff" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" text-anchor="middle">정보 다운로드</text>
  <line x1="0" y1="44" x2="300" y2="44" stroke="#262626" stroke-width="0.5"/>

  <!-- Description text -->
  <text x="16" y="66" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="12">내 정보의 사본을 다운로드하거나</text>
  <text x="16" y="82" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="12">다른 서비스로 전송하세요.</text>

  <!-- 정보 다운로드 또는 전송 option -->
  <rect x="0" y="96" width="300" height="52" fill="#1a0a14"/>
  <rect x="0" y="96" width="4" height="52" fill="#E1306C"/>
  <text x="16" y="118" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">정보 다운로드 또는 전송</text>
  <text x="16" y="136" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="12">계정의 데이터 사본 만들기</text>
  <path d="M280 116 L286 122 L280 128" fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="148" x2="300" y2="148" stroke="#262626" stroke-width="0.5"/>

  <!-- Label -->
  <rect x="60" y="74" width="164" height="20" rx="10" fill="#E1306C"/>
  <text x="142" y="88" fill="#fff" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">정보 다운로드 또는 전송 탭</text>

  <!-- JSON format section -->
  <text x="16" y="172" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="12">형식 선택:</text>

  <!-- HTML option -->
  <rect x="14" y="182" width="130" height="34" rx="8" fill="#222" stroke="#444" stroke-width="1"/>
  <text x="79" y="204" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="13" text-anchor="middle">HTML</text>

  <!-- JSON option - selected/highlighted -->
  <rect x="156" y="182" width="130" height="34" rx="8" fill="#2d0d1c" stroke="#E1306C" stroke-width="2"/>
  <text x="221" y="200" fill="#E1306C" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">JSON</text>
  <text x="221" y="213" fill="#E1306C" font-family="-apple-system,sans-serif" font-size="10" text-anchor="middle">← 반드시 선택</text>

  <!-- 파일 만들기 button -->
  <rect x="14" y="230" width="272" height="40" rx="8" fill="#0095f6"/>
  <text x="150" y="255" fill="#fff" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" text-anchor="middle">파일 만들기</text>

  <!-- Arrow pointing to button -->
  <line x1="150" y1="218" x2="150" y2="226" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
</svg>
