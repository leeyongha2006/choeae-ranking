<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 320" width="375" height="320">
  <rect width="375" height="320" fill="#0a0a0a"/>

  <!-- 정보 맞춤 설정 row (dimmed) -->
  <rect x="20" y="16" width="335" height="42" rx="8" fill="#1a1a1a"/>
  <text x="36" y="34" font-family="sans-serif" font-size="12" fill="#555">정보 맞춤 설정</text>
  <text x="36" y="50" font-family="sans-serif" font-size="10" fill="#444">사용 가능한 모든 정보</text>
  <text x="348" y="40" font-family="sans-serif" font-size="14" fill="#444" text-anchor="end">›</text>

  <!-- 기간 row (HIGHLIGHTED) -->
  <rect x="20" y="65" width="335" height="42" rx="8" fill="#1a1a1a"/>
  <text x="36" y="83" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">기간</text>
  <text x="36" y="99" font-family="sans-serif" font-size="10" fill="#888">작년</text>
  <text x="348" y="89" font-family="sans-serif" font-size="14" fill="#888" text-anchor="end">›</text>
  <!-- Red box around 기간 -->
  <rect x="16" y="61" width="343" height="50" rx="10" fill="none" stroke="#e1306c" stroke-width="2.5"/>
  <!-- Arrow label -->
  <text x="365" y="89" font-family="sans-serif" font-size="18" fill="#e1306c" text-anchor="end">←</text>

  <!-- 형식 row (HIGHLIGHTED) -->
  <rect x="20" y="114" width="335" height="42" rx="8" fill="#1a1a1a"/>
  <text x="36" y="132" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">형식</text>
  <text x="36" y="148" font-family="sans-serif" font-size="10" fill="#e05252">HTML  →  JSON 으로 변경!</text>
  <text x="348" y="138" font-family="sans-serif" font-size="14" fill="#888" text-anchor="end">›</text>
  <!-- Red box around 형식 -->
  <rect x="16" y="110" width="343" height="50" rx="10" fill="none" stroke="#e1306c" stroke-width="2.5"/>
  <!-- Arrow label -->
  <text x="365" y="138" font-family="sans-serif" font-size="18" fill="#e1306c" text-anchor="end">←</text>

  <!-- 미디어 품질 row (dimmed) -->
  <rect x="20" y="163" width="335" height="42" rx="8" fill="#1a1a1a"/>
  <text x="36" y="181" font-family="sans-serif" font-size="12" fill="#555">미디어 품질</text>
  <text x="36" y="197" font-family="sans-serif" font-size="10" fill="#444">보통 화질</text>
  <text x="348" y="187" font-family="sans-serif" font-size="14" fill="#444" text-anchor="end">›</text>

  <!-- Divider -->
  <line x1="20" y1="215" x2="355" y2="215" stroke="#222" stroke-width="1"/>

  <!-- 내보내기 시작 button -->
  <rect x="20" y="226" width="335" height="40" rx="8" fill="#3897f0"/>
  <text x="187" y="251" font-family="sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">내보내기 시작</text>

  <!-- Bottom instruction -->
  <text x="187" y="290" font-family="sans-serif" font-size="11" fill="#e1306c" text-anchor="middle" font-weight="bold">기간 → 전체 / 형식 → JSON 으로 변경 후 시작!</text>
</svg>
