<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Background -->
  <rect width="300" height="200" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="16" y="24" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="11">다운로드된 압축 파일을 풀면:</text>

  <!-- Folder tree -->
  <!-- Root zip -->
  <rect x="14" y="34" width="18" height="14" rx="2" fill="#f59e0b"/>
  <rect x="14" y="34" width="18" height="6" rx="2" fill="#d97706"/>
  <text x="38" y="45" fill="#e5e7eb" font-family="-apple-system, monospace, sans-serif" font-size="12">instagram-data.zip</text>

  <!-- Tree line -->
  <line x1="23" y1="48" x2="23" y2="72" stroke="#444" stroke-width="1.5"/>
  <line x1="23" y1="72" x2="36" y2="72" stroke="#444" stroke-width="1.5"/>

  <!-- messages folder -->
  <text x="18" y="78" fill="#6b7280" font-family="monospace" font-size="11">└</text>
  <text x="36" y="76" fill="#e5e7eb" font-family="-apple-system, monospace, sans-serif" font-size="12">📁 messages</text>

  <!-- Tree line from messages -->
  <line x1="51" y1="80" x2="51" y2="104" stroke="#444" stroke-width="1.5"/>
  <line x1="51" y1="104" x2="62" y2="104" stroke="#444" stroke-width="1.5"/>

  <!-- inbox folder -->
  <text x="46" y="110" fill="#6b7280" font-family="monospace" font-size="11">└</text>
  <text x="62" y="108" fill="#e5e7eb" font-family="-apple-system, monospace, sans-serif" font-size="12">📁 inbox</text>

  <!-- Tree line from inbox -->
  <line x1="76" y1="112" x2="76" y2="136" stroke="#444" stroke-width="1.5"/>
  <line x1="76" y1="136" x2="88" y2="136" stroke="#444" stroke-width="1.5"/>

  <!-- 친구이름 folder -->
  <text x="72" y="142" fill="#6b7280" font-family="monospace" font-size="11">└</text>
  <text x="88" y="140" fill="#e5e7eb" font-family="-apple-system, monospace, sans-serif" font-size="12">📁 친구이름</text>

  <!-- Tree line from 친구이름 -->
  <line x1="104" y1="144" x2="104" y2="168" stroke="#444" stroke-width="1.5"/>
  <line x1="104" y1="168" x2="116" y2="168" stroke="#444" stroke-width="1.5"/>

  <!-- message_1.json - HIGHLIGHTED -->
  <rect x="108" y="156" width="176" height="24" rx="5" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="100" y="172" fill="#6b7280" font-family="monospace" font-size="11">└</text>
  <text x="118" y="172" fill="#10b981" font-family="-apple-system, monospace, sans-serif" font-size="12" font-weight="700">message_1.json ← 이 파일</text>

  <!-- Bottom label -->
  <rect x="10" y="186" width="280" height="10" rx="5" fill="none"/>
  <text x="150" y="194" fill="#6b7280" font-family="-apple-system,sans-serif" font-size="10" text-anchor="middle">이 파일을 아래 버튼으로 올려요</text>
</svg>
