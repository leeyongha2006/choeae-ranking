<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 300" width="375" height="300">
  <rect width="375" height="300" fill="#0a0a0a"/>

  <!-- Header -->
  <text x="187" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">정보 맞춤 설정</text>

  <!-- Subtitle -->
  <text x="187" y="52" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">내보낼 정보를 선택하세요</text>

  <!-- Divider -->
  <line x1="20" y1="65" x2="355" y2="65" stroke="#222" stroke-width="1"/>

  <!-- Row 1: 메시지 - CHECKED (highlighted) -->
  <rect x="20" y="74" width="335" height="44" rx="8" fill="#1a1a1a" stroke="#e1306c" stroke-width="1.5"/>
  <!-- Checkbox checked -->
  <rect x="34" y="87" width="20" height="20" rx="4" fill="#e1306c"/>
  <polyline points="38,97 42,102 50,92" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">메시지</text>
  <text x="64" y="111" font-family="sans-serif" font-size="10" fill="#888">DM 대화 내용</text>

  <!-- Row 2: 사진 - UNCHECKED -->
  <rect x="20" y="124" width="335" height="44" rx="8" fill="#1a1a1a"/>
  <rect x="34" y="137" width="20" height="20" rx="4" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="64" y="148" font-family="sans-serif" font-size="13" fill="#666">사진 및 동영상</text>
  <text x="64" y="161" font-family="sans-serif" font-size="10" fill="#444">공유한 미디어</text>

  <!-- Row 3: 댓글 - UNCHECKED -->
  <rect x="20" y="174" width="335" height="44" rx="8" fill="#1a1a1a"/>
  <rect x="34" y="187" width="20" height="20" rx="4" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="64" y="198" font-family="sans-serif" font-size="13" fill="#666">댓글</text>
  <text x="64" y="211" font-family="sans-serif" font-size="10" fill="#444">게시물 댓글</text>

  <!-- Row 4: 좋아요 - UNCHECKED -->
  <rect x="20" y="224" width="335" height="44" rx="8" fill="#1a1a1a"/>
  <rect x="34" y="237" width="20" height="20" rx="4" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="64" y="248" font-family="sans-serif" font-size="13" fill="#666">좋아요</text>
  <text x="64" y="261" font-family="sans-serif" font-size="10" fill="#444">좋아요 표시한 게시물</text>

  <!-- Tip arrow pointing to 메시지 row -->
  <text x="187" y="285" font-family="sans-serif" font-size="11" fill="#e1306c" text-anchor="middle" font-weight="bold">↑ '메시지'만 체크, 나머지는 해제</text>
</svg>
