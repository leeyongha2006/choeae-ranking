<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- Background -->
  <rect width="300" height="230" fill="#1a1a1a"/>

  <!-- Top bar -->
  <path d="M16 22 L26 14 M16 22 L26 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="28" fill="#fff" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" text-anchor="middle">채팅방 설정</text>
  <line x1="0" y1="44" x2="300" y2="44" stroke="#333" stroke-width="0.5"/>

  <!-- Menu items -->
  <!-- 알림 설정 -->
  <rect x="0" y="44" width="300" height="44" fill="#1a1a1a"/>
  <text x="16" y="71" fill="#fff" font-family="-apple-system,sans-serif" font-size="14">알림 설정</text>
  <path d="M278 60 L284 66 L278 72" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="88" x2="300" y2="88" stroke="#333" stroke-width="0.5"/>

  <!-- 채팅방 배경 -->
  <rect x="0" y="88" width="300" height="44" fill="#1a1a1a"/>
  <text x="16" y="115" fill="#fff" font-family="-apple-system,sans-serif" font-size="14">채팅방 배경 화면</text>
  <path d="M278 104 L284 110 L278 116" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="132" x2="300" y2="132" stroke="#333" stroke-width="0.5"/>

  <!-- 대화 내보내기 - HIGHLIGHTED -->
  <rect x="0" y="132" width="300" height="44" fill="#2a200a"/>
  <rect x="0" y="132" width="4" height="44" fill="#FEE500"/>
  <text x="16" y="159" fill="#FEE500" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">대화 내보내기</text>
  <path d="M278 148 L284 154 L278 160" fill="none" stroke="#FEE500" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="176" x2="300" y2="176" stroke="#333" stroke-width="0.5"/>

  <!-- 채팅방 나가기 -->
  <rect x="0" y="176" width="300" height="44" fill="#1a1a1a"/>
  <text x="16" y="203" fill="#ff4444" font-family="-apple-system,sans-serif" font-size="14">채팅방 나가기</text>

  <!-- Label -->
  <rect x="56" y="110" width="172" height="20" rx="10" fill="#FEE500"/>
  <text x="142" y="124" fill="#3C1E1E" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">대화 내보내기 탭하기</text>
</svg>
