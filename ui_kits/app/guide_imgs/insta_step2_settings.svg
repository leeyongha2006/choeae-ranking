<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <!-- Background -->
  <rect width="300" height="220" fill="#000"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="300" height="44" fill="#000"/>
  <!-- Back arrow -->
  <path d="M16 22 L26 14 M16 22 L26 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Title -->
  <text x="150" y="28" fill="#fff" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">설정</text>
  <!-- Threads icon -->
  <text x="278" y="30" fill="#fff" font-family="-apple-system,sans-serif" font-size="16" text-anchor="middle">@</text>

  <!-- Divider -->
  <line x1="0" y1="44" x2="300" y2="44" stroke="#262626" stroke-width="0.5"/>

  <!-- Section: 내 계정 -->
  <text x="16" y="70" fill="#8e8e8e" font-family="-apple-system,sans-serif" font-size="12">내 계정</text>

  <!-- 계정 센터 row - HIGHLIGHTED -->
  <rect x="0" y="78" width="300" height="64" fill="#1a0a14"/>
  <rect x="0" y="78" width="4" height="64" fill="#E1306C"/>
  <!-- Account center icon -->
  <rect x="14" y="90" width="32" height="32" rx="16" fill="#333"/>
  <circle cx="30" cy="106" r="8" fill="none" stroke="#E1306C" stroke-width="1.5"/>
  <text x="30" y="110" fill="#E1306C" font-family="-apple-system,sans-serif" font-size="10" text-anchor="middle">@</text>
  <!-- 계정 센터 text -->
  <text x="56" y="101" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">계정 센터</text>
  <text x="56" y="118" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="11">비밀번호, 보안, 개인정보, 연결된 환경</text>
  <!-- Arrow -->
  <path d="M278 102 L286 110 L278 118" fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round"/>

  <!-- Meta badge -->
  <text x="274" y="86" fill="#8e8e8e" font-family="-apple-system,sans-serif" font-size="10" text-anchor="end">∞ Meta</text>

  <!-- Divider -->
  <line x1="0" y1="142" x2="300" y2="142" stroke="#262626" stroke-width="0.5"/>

  <!-- Section: 내 Instagram 사용 방식 -->
  <text x="16" y="162" fill="#8e8e8e" font-family="-apple-system,sans-serif" font-size="12">내 Instagram 사용 방식</text>

  <!-- 프로필 편집 row -->
  <rect x="0" y="170" width="300" height="44" fill="#1a1a1a"/>
  <rect x="14" y="180" width="24" height="24" rx="12" fill="#333"/>
  <text x="26" y="197" fill="#8e8e8e" font-family="-apple-system,sans-serif" font-size="14" text-anchor="middle">👤</text>
  <text x="52" y="197" fill="#fff" font-family="-apple-system,sans-serif" font-size="14">프로필 편집</text>

  <!-- Highlight label -->
  <rect x="60" y="56" width="120" height="20" rx="10" fill="#E1306C"/>
  <text x="120" y="70" fill="#fff" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">계정 센터 탭하기</text>
</svg>
