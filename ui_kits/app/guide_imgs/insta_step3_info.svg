<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <!-- Background -->
  <rect width="300" height="260" fill="#000"/>

  <!-- Top bar -->
  <path d="M16 22 L26 14 M16 22 L26 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="28" fill="#fff" font-family="-apple-system,sans-serif" font-size="15" font-weight="700">계정 설정</text>
  <text x="12" y="50" fill="#8e8e8e" font-family="-apple-system,sans-serif" font-size="11">y.h____0</text>
  <line x1="0" y1="60" x2="300" y2="60" stroke="#262626" stroke-width="0.5"/>

  <!-- Menu items -->
  <!-- 개인 정보 및 정보 -->
  <rect x="0" y="60" width="300" height="48" fill="#000"/>
  <rect x="14" y="74" width="20" height="20" rx="4" fill="#333"/>
  <line x1="17" y1="84" x2="31" y2="84" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="88" x2="27" y2="88" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="44" y="88" fill="#fff" font-family="-apple-system,sans-serif" font-size="14">개인 정보 및 정보</text>
  <path d="M278 78 L284 84 L278 90" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="108" x2="300" y2="108" stroke="#262626" stroke-width="0.5"/>

  <!-- 내 정보 및 권한 - HIGHLIGHTED -->
  <rect x="0" y="108" width="300" height="48" fill="#1a0a14"/>
  <rect x="0" y="108" width="4" height="48" fill="#E1306C"/>
  <rect x="14" y="122" width="20" height="20" rx="4" fill="#2d0d1c"/>
  <text x="24" y="136" fill="#E1306C" font-family="-apple-system,sans-serif" font-size="14" text-anchor="middle">👤</text>
  <text x="44" y="136" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">내 정보 및 권한</text>
  <path d="M278 126 L284 132 L278 138" fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="156" x2="300" y2="156" stroke="#262626" stroke-width="0.5"/>

  <!-- 계정 소유권 및 관리 -->
  <rect x="0" y="156" width="300" height="48" fill="#000"/>
  <rect x="14" y="170" width="20" height="20" rx="4" fill="#333"/>
  <text x="24" y="184" fill="#8e8e8e" font-family="-apple-system,sans-serif" font-size="14" text-anchor="middle">⚙</text>
  <text x="44" y="184" fill="#fff" font-family="-apple-system,sans-serif" font-size="14">계정 소유권 및 관리</text>
  <path d="M278 174 L284 180 L278 186" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Next step hint inside the expanded row -->
  <rect x="44" y="158" width="200" height="14" rx="7" fill="none"/>

  <!-- Label -->
  <rect x="48" y="88" width="160" height="20" rx="10" fill="#E1306C"/>
  <text x="128" y="102" fill="#fff" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">내 정보 및 권한 탭하기</text>

  <!-- Sub-step hint -->
  <rect x="10" y="210" width="280" height="40" rx="8" fill="#1a0a14" stroke="#E1306C" stroke-width="0.5"/>
  <text x="20" y="228" fill="#E1306C" font-family="-apple-system,sans-serif" font-size="11" font-weight="700">다음으로</text>
  <text x="20" y="244" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="11">내 정보 및 권한 → 내 정보 다운로드 탭하기</text>
</svg>
