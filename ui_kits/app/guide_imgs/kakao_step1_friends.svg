<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <!-- Background -->
  <rect width="300" height="220" fill="#1a1a1a"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="300" height="50" fill="#1a1a1a"/>
  <text x="16" y="32" fill="#fff" font-family="-apple-system,sans-serif" font-size="18" font-weight="700">친구</text>
  <!-- Search icon, settings -->
  <circle cx="254" cy="25" r="10" fill="none" stroke="#888" stroke-width="1.5"/>
  <line x1="261" y1="32" x2="265" y2="36" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="272" y1="16" x2="272" y2="34" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="268" y1="22" x2="276" y2="22" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="268" y1="28" x2="276" y2="28" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="0" y1="50" x2="300" y2="50" stroke="#333" stroke-width="0.5"/>

  <!-- Friend list items -->
  <!-- Friend 1 -->
  <circle cx="36" cy="76" r="18" fill="#FEE500"/>
  <text x="36" y="80" fill="#3C1E1E" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" text-anchor="middle">민지</text>
  <text x="64" y="70" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">김민지</text>
  <text x="64" y="87" fill="#888" font-family="-apple-system,sans-serif" font-size="12">안녕 오늘 뭐해?</text>
  <line x1="0" y1="100" x2="300" y2="100" stroke="#333" stroke-width="0.5"/>

  <!-- Friend 2 -->
  <circle cx="36" cy="124" r="18" fill="#4A90E2"/>
  <text x="36" y="128" fill="#fff" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" text-anchor="middle">준호</text>
  <text x="64" y="118" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">이준호</text>
  <text x="64" y="135" fill="#888" font-family="-apple-system,sans-serif" font-size="12">ㅋㅋㅋ 진짜요?</text>
  <line x1="0" y1="148" x2="300" y2="148" stroke="#333" stroke-width="0.5"/>

  <!-- Friend 3 -->
  <circle cx="36" cy="172" r="18" fill="#50C878"/>
  <text x="36" y="176" fill="#fff" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" text-anchor="middle">서연</text>
  <text x="64" y="166" fill="#fff" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">박서연</text>
  <text x="64" y="183" fill="#888" font-family="-apple-system,sans-serif" font-size="12">내일 몇시에 만나?</text>

  <!-- Instruction label -->
  <rect x="60" y="198" width="180" height="20" rx="10" fill="#FEE500"/>
  <text x="150" y="212" fill="#3C1E1E" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" text-anchor="middle">비교할 친구 채팅방 하나씩 열기</text>
</svg>
