<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Background -->
  <rect width="300" height="200" fill="#f4f4f4"/>

  <!-- Email card -->
  <rect x="12" y="12" width="276" height="176" rx="10" fill="#fff" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Email header - Instagram gradient -->
  <defs>
    <linearGradient id="igGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#833AB4"/>
      <stop offset="50%" stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="276" height="5" rx="3" fill="url(#igGrad)"/>

  <!-- Instagram logo area -->
  <rect x="12" y="17" width="276" height="44" fill="#fff"/>
  <!-- Instagram wordmark area -->
  <text x="36" y="46" fill="#262626" font-family="Georgia,serif" font-size="18" font-weight="400" font-style="italic">Instagram</text>

  <!-- Divider -->
  <line x1="12" y1="61" x2="288" y2="61" stroke="#dbdbdb" stroke-width="0.5"/>

  <!-- Email body -->
  <text x="24" y="84" fill="#262626" font-family="-apple-system,sans-serif" font-size="13" font-weight="700">데이터 다운로드 준비 완료</text>
  <text x="24" y="102" fill="#737373" font-family="-apple-system,sans-serif" font-size="12">요청하신 Instagram 데이터가</text>
  <text x="24" y="118" fill="#737373" font-family="-apple-system,sans-serif" font-size="12">준비되었습니다. 30일 이내에</text>
  <text x="24" y="134" fill="#737373" font-family="-apple-system,sans-serif" font-size="12">다운로드해 주세요.</text>

  <!-- Download button -->
  <rect x="24" y="146" width="252" height="34" rx="6" fill="#0095f6"/>
  <text x="150" y="168" fill="#fff" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" text-anchor="middle">내 데이터 다운로드</text>

  <!-- Mail from info -->
  <text x="24" y="192" fill="#a8a8a8" font-family="-apple-system,sans-serif" font-size="10">보낸 사람: security@mail.instagram.com</text>
</svg>
