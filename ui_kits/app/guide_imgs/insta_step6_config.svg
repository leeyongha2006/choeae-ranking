<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290">
  <rect width="400" height="290" fill="#0a0a0a"/>

  <!-- LEFT PANEL: 정보 맞춤 설정 -->
  <!-- Panel label -->
  <text x="12" y="18" font-family="sans-serif" font-size="10" fill="#888">① 정보 맞춤 설정</text>

  <!-- 메시지 row — CHECKED, highlighted -->
  <rect x="8" y="24" width="175" height="36" rx="6" fill="#1a1a1a"/>
  <!-- Checkbox checked -->
  <rect x="17" y="33" width="15" height="15" rx="3" fill="#3897f0"/>
  <text x="18" y="45" font-family="sans-serif" font-size="11" fill="white" font-weight="bold">✓</text>
  <text x="38" y="42" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">메시지</text>
  <!-- Red box -->
  <rect x="5" y="21" width="181" height="42" rx="7" fill="none" stroke="#e1306c" stroke-width="2.2"/>
  <text x="190" y="44" font-family="sans-serif" font-size="14" fill="#e1306c" text-anchor="end">←</text>

  <!-- 사진 row — UNCHECKED -->
  <rect x="8" y="68" width="175" height="34" rx="6" fill="#1a1a1a"/>
  <rect x="17" y="77" width="15" height="15" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="38" y="89" font-family="sans-serif" font-size="12" fill="#555">사진</text>

  <!-- 동영상 row — UNCHECKED -->
  <rect x="8" y="106" width="175" height="34" rx="6" fill="#1a1a1a"/>
  <rect x="17" y="115" width="15" height="15" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="38" y="127" font-family="sans-serif" font-size="12" fill="#555">동영상</text>

  <!-- 댓글 row — UNCHECKED -->
  <rect x="8" y="144" width="175" height="34" rx="6" fill="#1a1a1a"/>
  <rect x="17" y="153" width="15" height="15" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="38" y="165" font-family="sans-serif" font-size="12" fill="#555">댓글</text>

  <!-- 스토리 row — UNCHECKED -->
  <rect x="8" y="182" width="175" height="34" rx="6" fill="#1a1a1a"/>
  <rect x="17" y="191" width="15" height="15" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="38" y="203" font-family="sans-serif" font-size="12" fill="#555">스토리</text>

  <!-- Instruction label -->
  <text x="95" y="234" font-family="sans-serif" font-size="10" fill="#e1306c" text-anchor="middle" font-weight="bold">메시지만 체크!</text>

  <!-- DIVIDER -->
  <line x1="200" y1="14" x2="200" y2="248" stroke="#333" stroke-width="1"/>
  <text x="200" y="138" font-family="sans-serif" font-size="22" fill="#555" text-anchor="middle" dominant-baseline="middle">→</text>

  <!-- RIGHT PANEL: 기간·형식 설정 -->
  <text x="212" y="18" font-family="sans-serif" font-size="10" fill="#888">② 기간·형식 설정</text>

  <!-- 기간 row — HIGHLIGHTED -->
  <rect x="208" y="24" width="180" height="42" rx="6" fill="#1a1a1a"/>
  <text x="222" y="42" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">기간</text>
  <text x="222" y="56" font-family="sans-serif" font-size="10" fill="#888">작년</text>
  <text x="382" y="47" font-family="sans-serif" font-size="14" fill="#888" text-anchor="end">›</text>
  <rect x="205" y="21" width="186" height="48" rx="8" fill="none" stroke="#e1306c" stroke-width="2.2"/>
  <text x="395" y="47" font-family="sans-serif" font-size="14" fill="#e1306c" text-anchor="end">←</text>

  <!-- 형식 row — HIGHLIGHTED -->
  <rect x="208" y="74" width="180" height="42" rx="6" fill="#1a1a1a"/>
  <text x="222" y="92" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">형식</text>
  <text x="222" y="106" font-family="sans-serif" font-size="10" fill="#e05252">HTML → JSON!</text>
  <text x="382" y="97" font-family="sans-serif" font-size="14" fill="#888" text-anchor="end">›</text>
  <rect x="205" y="71" width="186" height="48" rx="8" fill="none" stroke="#e1306c" stroke-width="2.2"/>
  <text x="395" y="97" font-family="sans-serif" font-size="14" fill="#e1306c" text-anchor="end">←</text>

  <!-- 미디어 품질 row — dimmed -->
  <rect x="208" y="124" width="180" height="36" rx="6" fill="#1a1a1a"/>
  <text x="222" y="142" font-family="sans-serif" font-size="12" fill="#444">미디어 품질</text>
  <text x="222" y="154" font-family="sans-serif" font-size="10" fill="#333">보통 화질</text>
  <text x="382" y="145" font-family="sans-serif" font-size="14" fill="#333" text-anchor="end">›</text>

  <!-- Divider -->
  <line x1="208" y1="170" x2="388" y2="170" stroke="#222" stroke-width="1"/>

  <!-- 내보내기 시작 button -->
  <rect x="208" y="178" width="180" height="36" rx="7" fill="#3897f0"/>
  <text x="298" y="201" font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">내보내기 시작</text>

  <!-- Instruction label -->
  <text x="298" y="234" font-family="sans-serif" font-size="10" fill="#e1306c" text-anchor="middle" font-weight="bold">기간→전체 / 형식→JSON 후 시작!</text>

  <!-- Bottom bar -->
  <rect x="0" y="252" width="400" height="38" rx="0" fill="#111"/>
  <text x="200" y="275" font-family="sans-serif" font-size="11" fill="#e1306c" text-anchor="middle" font-weight="bold">
    ① 메시지만 체크  ·  ② 기간: 전체, 형식: JSON 으로 바꾸기
  </text>
</svg>
