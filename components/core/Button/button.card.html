<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-canvas);font-family:var(--font-body)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Button } = window.DesignSystem_8db18d;
function Row({children}){ return <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>{children}</div>; }
function App(){
  return (
    <div style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
      <Row>
        <Button variant="primary">시작하기</Button>
        <Button variant="secondary">보기</Button>
        <Button variant="danger">삭제</Button>
        <Button variant="default">소개</Button>
        <Button variant="default" active>가이드</Button>
        <Button variant="chip">이번 달</Button>
        <Button variant="chip" active>지난 달</Button>
      </Row>
      <Row>
        <Button variant="primary" size="sm">작게</Button>
        <Button variant="primary" size="lg">크게</Button>
        <Button variant="primary" disabled>비활성</Button>
        <Button variant="primary" icon={<span>👑</span>}>TOP 5 보기</Button>
      </Row>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
