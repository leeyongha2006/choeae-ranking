<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base scale, kept verbatim from the wireframe's auto-layout gaps" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-canvas);padding:18px;box-sizing:border-box;font-family:var(--font-body)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{background:var(--violet-500);height:14px;border-radius:4px}
.lbl{font-size:11px;color:var(--text-secondary);width:110px}
</style></head><body>
<div class="row"><span class="lbl">space-1 · 4px</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="lbl">space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lbl">space-3 · 12px</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lbl">space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lbl">space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lbl">space-7 · 32px</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lbl">space-9 · 48px</span><div class="bar" style="width:48px"></div></div>
</body></html>
