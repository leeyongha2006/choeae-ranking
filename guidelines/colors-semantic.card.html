<!-- @dsCard group="Colors" viewport="700x150" name="Rank Medals & Feedback" subtitle="Semantic colors: gold/silver/bronze, success/danger/warning" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-body);background:var(--surface-canvas)}
.wrap{display:flex;gap:10px;padding:18px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:var(--ink-900);font-size:11px;font-weight:600}
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:var(--rank-gold)">🥇 rank-gold</div>
  <div class="sw" style="background:var(--rank-silver)">🥈 rank-silver</div>
  <div class="sw" style="background:var(--rank-bronze);color:#fff">🥉 rank-bronze</div>
  <div class="sw" style="background:var(--color-success);color:#fff">success</div>
  <div class="sw" style="background:var(--color-danger);color:#fff">danger</div>
  <div class="sw" style="background:var(--color-warning)">warning</div>
</div>
</body></html>
