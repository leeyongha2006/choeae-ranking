<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-body);background:var(--surface-canvas)}
.wrap{display:flex;gap:10px;padding:18px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:var(--ink-900);font-size:11px;font-weight:600}
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:var(--yellow-400)">yellow-400 (kakao-adjacent)</div>
  <div class="sw" style="background:var(--yellow-100)">yellow-100</div>
  <div class="sw" style="background:var(--mint-400)">mint-400</div>
  <div class="sw" style="background:var(--mint-100)">mint-100</div>
  <div class="sw" style="background:var(--orange-500);color:#fff">orange-500</div>
  <div class="sw" style="background:var(--orange-100)">orange-100</div>
</div>
</body></html>
