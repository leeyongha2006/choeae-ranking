<!-- @dsCard group="Spacing" viewport="700x150" name="Radii scale" subtitle="Soft, large radii vs. the wireframe's plain 4-6px" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-canvas);padding:18px;box-sizing:border-box;font-family:var(--font-body);display:flex;gap:14px;align-items:flex-end}
.box{background:var(--violet-100);border:1px solid var(--violet-500);width:100px;height:80px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--violet-700)}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">sm 8px</div>
<div class="box" style="border-radius:var(--radius-md)">md 14px</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 20px</div>
<div class="box" style="border-radius:var(--radius-xl)">xl 28px</div>
<div class="box" style="border-radius:var(--radius-pill);width:80px">pill</div>
</body></html>
