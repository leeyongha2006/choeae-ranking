<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-body);background:var(--surface-canvas)}
.wrap{display:flex;gap:10px;padding:18px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;color:#fff;font-size:11px;font-weight:600}
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:var(--violet-700)">violet-700</div>
  <div class="sw" style="background:var(--violet-600)">violet-600 · primary</div>
  <div class="sw" style="background:var(--violet-500)">violet-500</div>
  <div class="sw" style="background:var(--violet-100);color:var(--ink-900)">violet-100</div>
  <div class="sw" style="background:var(--pink-600)">pink-600</div>
  <div class="sw" style="background:var(--pink-500)">pink-500 · accent</div>
  <div class="sw" style="background:var(--pink-400)">pink-400</div>
  <div class="sw" style="background:var(--pink-100);color:var(--ink-900)">pink-100</div>
</div>
</body></html>
