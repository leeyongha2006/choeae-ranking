<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Ink & Paper" subtitle="Text and surface neutrals" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-body);background:var(--surface-canvas)}
.wrap{display:flex;gap:10px;padding:18px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:600;box-shadow:inset 0 0 0 1px var(--border-soft)}
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:var(--ink-900);color:#fff;box-shadow:none">ink-900</div>
  <div class="sw" style="background:var(--ink-700);color:#fff;box-shadow:none">ink-700</div>
  <div class="sw" style="background:var(--ink-500);color:#fff;box-shadow:none">ink-500</div>
  <div class="sw" style="background:var(--ink-300);color:#fff;box-shadow:none">ink-300</div>
  <div class="sw" style="background:var(--paper-0);color:var(--ink-900)">paper-0 · canvas</div>
  <div class="sw" style="background:var(--paper-50);color:var(--ink-900)">paper-50 · card</div>
  <div class="sw" style="background:var(--paper-100);color:var(--ink-900)">paper-100 · sunken</div>
  <div class="sw" style="background:var(--paper-200);color:var(--ink-900)">paper-200 · border</div>
</div>
</body></html>
