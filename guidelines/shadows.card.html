<!-- @dsCard group="Spacing" viewport="700x150" name="Shadows" subtitle="Soft colored shadows — no neutral drop shadows" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-canvas);padding:24px;box-sizing:border-box;font-family:var(--font-body);display:flex;gap:26px}
.box{background:#fff;width:110px;height:80px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary);text-align:center}
</style></head><body>
<div class="box" style="box-shadow:var(--shadow-card)">shadow-card</div>
<div class="box" style="box-shadow:var(--shadow-card-hover)">card-hover</div>
<div class="box" style="box-shadow:var(--shadow-pop)">shadow-pop</div>
<div class="box" style="box-shadow:var(--shadow-pop-yellow)">pop-yellow</div>
<div class="box" style="box-shadow:var(--shadow-inset-strong)">inset-strong</div>
</body></html>
