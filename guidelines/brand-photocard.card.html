<!-- @dsCard group="Brand" viewport="700x220" name="Photocard motif" subtitle="Holo gradient + medal moment — the core share-card DNA" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-canvas);padding:18px;box-sizing:border-box;font-family:var(--font-body);display:flex;gap:16px}
.card{width:210px;height:180px;border-radius:var(--radius-xl);background:var(--gradient-holo);box-shadow:var(--shadow-pop);position:relative;overflow:hidden;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.sheen{position:absolute;top:-40%;left:-20%;width:60%;height:180%;background:rgba(255,255,255,.28);transform:rotate(18deg)}
.badge{font-family:var(--font-display);color:#fff;font-size:13px}
.num{font-family:var(--font-display);color:#fff;font-size:44px;line-height:1}
.name{font-family:var(--font-body);font-weight:700;color:#fff;font-size:14px}
</style></head><body>
<div class="card"><div class="sheen"></div><div class="badge">최애친구랭킹 · 2026.07</div><div class="num">🥇</div><div class="name">김민지 · 1,847회</div></div>
<div style="display:flex;flex-direction:column;gap:10px;justify-content:center;font-size:12px;color:var(--text-secondary);max-width:340px">
  <div>실제 K-pop 팬 "포토카드(포카)" 문화에서 모티프를 가져온 공유 카드 언어: 홀로그램 그라디언트 + 대각선 시트지 하이라이트 + 굵은 랭킹 숫자.</div>
  <div>일반 UI에서는 절대 쓰지 않고, 공유 카드/1위 모먼트에서만 등장시켜 특별함을 유지합니다.</div>
</div>
</body></html>
